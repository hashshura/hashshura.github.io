name = "wordfall"
main = "src/index.js"
compatibility_date = "2026-01-01"

# The simulation is imported from ../assets/js so that the blog post and this
# server run byte-identical rules. wrangler bundles it in.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# Durable Objects need a migration to be created the first time.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

# Uncomment once the DNS record exists, to serve from your own domain instead of
# the workers.dev subdomain:
# routes = [{ pattern = "api.ashura.id", custom_domain = true }]
