permalink:           /:title

# Setup
title:               'Catatan Ashura'
tagline:             'Asif Hummam Rais kalau disingkat jadi apa?'
description:         'Blog pribadi Asif, seorang <i>programmer</i> yang hidup biasa-biasa saja dan senang berperilaku kekanak-kanakan.'
url:                 https://hashshura.github.io
baseurl:             ''
paginate:            5

# About/contact
author:
  name:         Asif Hummam Rais
  url:          https://ashura.id
  email:        hashshura@gmail.com

# Custom vars
version:             1.0.0

# The Cloudflare Worker lives in this repo but is not part of the website.
# Without excluding it, GitHub Pages' jekyll-readme-index plugin (on by default)
# publishes server/README.md as a page, and it turns up in the sidebar nav.
# Note: setting `exclude` replaces Jekyll's defaults, so they are repeated here.
exclude:
  - server
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - .jekyll-cache
  - .sass-cache

# and belt-and-braces: never treat a README as a page
readme_index:
  enabled: false
  remove_originals: false

gems: [jekyll-paginate]
paginate: 5
paginate_path: "page:num"
